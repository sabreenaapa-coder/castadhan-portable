app:
  calculation_method: ISNA
  host: 0.0.0.0
  # Location is intentionally empty in the default config. The welcome wizard
  # fills it in via "Search & Set" (recommended) or the IP-geolocation
  # auto-detect button (known unreliable on some UK ISPs — see B-Belgium-1,
  # O3 in INCIDENT_REPORT for context).
  location:
    city: ''
    country: ''
    latitude: 0.0
    longitude: 0.0
  port: 8786
  # Timezone is also filled by the wizard once the location is set. Default is
  # London; the wizard's timezone dropdown auto-suggests based on lat/lon and
  # has 55+ entries with regional optgroups.
  timezone: Europe/London

# Full audio library. Files are pre-converted on the build machine to
# *_compatible.mp3 siblings so the Pi never needs to invoke pydub (which OOMs
# on Pi 3 A+ / Pi Zero W). See Issues 4-9 in the incident report.
audio:
  adhan: audio/adhan.mp3
  asr_warning: audio/asr_warning.mp3
  barry_dua: audio/friday_prayer_BARRY_DUA.mp3
  dhuhr_warning: audio/dhuhr_warning.mp3
  evening_dhikr: audio/evening_dhikr.mp3
  fajr_adhan: audio/fajr_adhan.mp3
  fajr_warning: audio/fajr_warning.mp3
  friday_prayer: audio/friday_prayer.mp3
  maghrib_warning: audio/maghrib_warning.mp3
  morning_dhikr: audio/morning_dhikr.mp3
  suhoor_alarm: audio/suhoor_alarm.mp3
  surah_kahf: audio/surah_kahf.mp3
  takbeeraat: audio/takbeeraat.mp3
  twilight: audio/twilight.mp3
  wakeup: audio/wakey_wakey.mp3

rules:
  # Auto-detect was found unreliable on UK ISPs that return the carrier's POP
  # instead of the customer's actual location (TalkTalk -> Birkenhead/Chester).
  # Default is OFF — users should use the wizard's Search & Set instead.
  auto_detect_location_on_startup: false
  enable_eid_takbeeraat: true
  evening_after_maghrib_minutes: 30
  evening_dhikr_cutoff_time: '20:00'
  fajr_at_start_when_isha_capped: true
  fajr_minutes_before_sunrise: 30
  fajr_mode: raw
  fajr_weekend_offset_minutes: -30
  fajr_workday_cap: 07:00
  friday_prayer_gap_seconds: 5
  # Default: static_offset (most aligned with mainstream UK/EU mosque practice).
  # Other options:
  #   combine_prayers — Isha skipped + Fajr shifted to sunrise-30 (conservative)
  #   1_7_rule        — fractions of the night
  # Only matters for users above 45° latitude in summer; wizard surfaces a
  # picker on first install when latitude qualifies.
  high_latitude_method: static_offset
  isha_max_time: ''
  isha_static_offset_minutes: 90
  morning_dhikr_time: 07:00
  setup_complete: false
  skip_isha_during_persistent_twilight: true
  suhoor_lead_minutes: 30
  twilight_scan_frequency_days: 14
  wakeup_enabled: false
  wakeup_time: 06:30
  wakeup_weekdays_only: true
  # UI language: en / nl / fr / ar. The wizard exposes a language picker.
  language: en

# v1.9.8 Quran Programs framework. Six pre-shipped entries; all disabled by
# default except surah_kahf (which preserves the existing Friday Kahf behaviour
# bridged via the legacy code path — full migration in v1.9.9).
#
# Trigger types:
#   - "fixed":              play at a specific HH:MM local time on selected days
#   - "relative_to_prayer": play at (anchor prayer time) + offset_minutes
#                           (offset can be negative for "before prayer")
#
# audio_url: pre-populated with v1.9.8 audio-pack-v1 release URLs. Use
# file:///home/farley/staging/<name>.mp3 if you'd rather scp a file directly.
#
# target_speakers: empty list = no speakers selected. For multi-speaker homes,
# the dashboard forces the user to explicitly tick speakers (no surprise
# playback in bedrooms). Single-speaker homes auto-select the only speaker.
scheduled_audio:
  surah_baqarah:
    name: Surah al-Baqarah
    category: Quran
    enabled: false
    trigger_type: fixed
    play_time: '10:00'
    relative_prayer_anchor: none
    offset_minutes: 0
    days: [0, 1, 2, 3, 4, 5, 6]
    audio_url: https://github.com/sabreenaapa-coder/castadhan-portable/releases/download/audio-pack-v1/surah_baqarah.mp3
    target_speakers: []
    max_duration_minutes: 150
  surah_yasin:
    name: Surah Yasin
    category: Quran
    enabled: false
    trigger_type: relative_to_prayer
    play_time: ''
    relative_prayer_anchor: Maghrib
    offset_minutes: 15
    days: [3]
    audio_url: https://github.com/sabreenaapa-coder/castadhan-portable/releases/download/audio-pack-v1/surah_yasin.mp3
    target_speakers: []
    max_duration_minutes: 60
  surah_mulk:
    name: Surah al-Mulk
    category: Quran
    enabled: false
    trigger_type: fixed
    play_time: '22:00'
    relative_prayer_anchor: none
    offset_minutes: 0
    days: [0, 1, 2, 3, 4, 5, 6]
    audio_url: https://github.com/sabreenaapa-coder/castadhan-portable/releases/download/audio-pack-v1/surah_mulk.mp3
    target_speakers: []
    max_duration_minutes: 35
  surah_kahf:
    name: Surah al-Kahf
    category: Quran
    enabled: true
    # v1.9.9: Kahf fires solely via scheduled_audio (legacy Friday
    # substitution in play_morning_dhikr removed). Fixed 07:00 Friday is
    # the historical time; __all__ = every speaker (legacy behaviour).
    trigger_type: fixed
    play_time: '07:00'
    relative_prayer_anchor: none
    offset_minutes: 0
    days: [4]
    audio_url: bundled
    target_speakers: ['__all__']
    max_duration_minutes: 35
  surah_waqiah:
    name: Surah al-Waqi'ah
    category: Quran
    enabled: false
    trigger_type: fixed
    play_time: '17:00'
    relative_prayer_anchor: none
    offset_minutes: 0
    days: [0, 1, 2, 3, 4, 5, 6]
    audio_url: https://github.com/sabreenaapa-coder/castadhan-portable/releases/download/audio-pack-v1/surah_waqiah.mp3
    target_speakers: []
    max_duration_minutes: 20
  surah_sajdah:
    name: Surah as-Sajdah
    category: Quran
    enabled: false
    trigger_type: relative_to_prayer
    play_time: ''
    relative_prayer_anchor: Fajr
    offset_minutes: 15
    days: [4]
    audio_url: https://github.com/sabreenaapa-coder/castadhan-portable/releases/download/audio-pack-v1/surah_sajdah.mp3
    target_speakers: []
    max_duration_minutes: 10

speakers:
  audio_routing: {}
  # Exclude common Cast "displays" (Nest Hub etc.) which appear as Cast targets
  # but don't really suit adhan playback.
  exclude_if_name_contains_any:
  - display
  - hub
  - nest hub
  general_volume: 0.7
  # MUST be empty by default. Earlier shipped "speaker" — blocked any speaker
  # without the English word "speaker" in its name (e.g. Dutch "Huiskamer").
  # See B-Belgium-1 in INCIDENT_REPORT for the field bug that surfaced this.
  include_if_name_contains: ""
  suhoor_exclude_names: []
