# CastAdhan Portable — captive-portal DNS hijack for the onboarding hotspot.
# ==========================================================================
# Installed by setup-pi.sh to /etc/NetworkManager/dnsmasq-shared.d/.
# NetworkManager loads files from this directory ONLY into the dnsmasq
# instance it runs for a SHARED-mode connection — i.e. our "CastAdhan Setup"
# access point (ipv4.method shared). It has NO effect on normal operation:
# when the box is a WiFi/Ethernet client there is no shared connection, so
# this file is never loaded.
#
# While the setup AP is up, resolve EVERY domain to the Pi (10.42.0.1) so a
# joining phone's connectivity check lands on our captive responder (:80) and
# the WiFi setup page auto-opens.
address=/#/10.42.0.1

# Keep leases short so a reconnecting phone gets a clean address.
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1
